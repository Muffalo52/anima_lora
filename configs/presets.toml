# Hardware / run-scope presets — the middle layer of the merge chain
# (base.toml → presets.toml[<preset>] → methods/<method>.toml → CLI).
#
# `[<name>.gui]` sub-tables are display metadata for the GUI preset picker
# (stripped from the merge — see _METADATA_CONFIG_SECTIONS in
# library/config/io.py). Only `group = "hardware"` sections appear in the
# GUI's Hardware dropdown; data-scope presets ([half] etc.) stay CLI-only —
# the GUI exposes sample_ratio / artists_shard as plain form fields instead.

[default]
blocks_to_swap = 0

[default.gui]
group = "hardware"
label = "Default (16GB+)"
description = "No memory-saving tricks — fastest when the model fits."
order = 10

[low_vram]
gradient_checkpointing = true # only triggered when low_vram was set
unsloth_offload_checkpointing = true  # only triggered when low_vram was set

[low_vram.gui]
group = "hardware"
label = "Low VRAM (8GB)"
description = "Gradient checkpointing + Unsloth offload checkpointing."
order = 20

[graft]
blocks_to_swap = 20

[half]
sample_ratio = 0.5

[half.gui]
group = "data"

[quarter]
sample_ratio = 0.25

[quarter.gui]
group = "data"

[tenth]
sample_ratio = 0.1

[tenth.gui]
group = "data"

[debug]
sample_ratio = 0.001

[debug.gui]
group = "data"
