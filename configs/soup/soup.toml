# Soup — the ingredient config for `make soup TARGET=<artist>`.
#
# Self-contained per-method file (the EasyControl-pilot layout): `--method soup`
# auto-discovers it via `_resolve_method_path` (preferred over any flat
# configs/methods/soup.toml). It exists so the soup pipeline no longer piggybacks
# on configs/methods/lora.toml — that file is an experiment scratchpad (drifting
# path_pattern / output_name, comment-toggle-able ortho/T-LoRA/Hydra/REPA), and
# souping REQUIRES a stable PLAIN-LoRA stack (scripts/soup/build.py refuses
# Hydra / chimera / stacked-experts / ortho key shapes).
#
# Two roles in one file:
#   * the flat scalars below are the train.py method config for the Phase 1
#     uncond inter-train + the Phase 2 seeded fine-tunes (both run
#     `train.py --method soup`);
#   * the `[soup]` table holds the pipeline defaults (pool / dose / seeds / rank)
#     read directly by scripts/soup/pipeline.py — it's stripped before the
#     argparse-flat merge (registered as a metadata section) so train.py never
#     sees it.
#
# The dataset blueprint is inherited from base.toml. `path_pattern` below is the
# Phase-2 fine-tune glob and doubles as the DEFAULT selection for `make soup`
# when neither PATH_PATTERN= nor TARGET= is passed (both still override it, as
# does the pipeline's Phase-1 uncond pool glob). output_name is set per run.

# --- plain-LoRA stack (matches the validated recipe, bench/memorization/report.md)
# 90, 128, 152, 180, 214 each for 16, 32, 48, 64, 96
network_alpha = 128
network_dim = 32
down_init = "weight_svd"

learning_rate = 2e-5
max_train_epochs = 4
save_every_n_epochs = 4
checkpointing_epochs = 4

use_shuffled_caption_variants = true
cache_llm_adapter_outputs = true
caption_dropout_rate = 0.1   # Phase 1 overrides to 1.0 (uncond); Phase 2 keeps this
path_pattern = "*"    # Phase-2 fine-tune glob + default `make soup` selection (PATH_PATTERN=/TARGET= override)

# REPA aux loss (training-time regularizer, plain-LoRA-safe — no checkpoint key
# change, so the soup guard still passes). PREREQ: `make preprocess-pe-spatial`.
use_repa     = true
repa_mode    = "relational"
repa_weight  = 0.05
repa_layer   = 8
repa_encoder = "pe_spatial"

# --- pipeline defaults (read by scripts/soup/pipeline.py; stripped from the
# train.py merge). CLI flags / env knobs (POOL_SHARD_N / UNCOND_RATIO / … ) still
# override these per run.
[soup]
pool_path_pattern = "*"  # Phase 1 uncond pool glob; "*" = whole dataset (diluted by uncond_ratio). The fine-tune path_pattern is always unioned in.
uncond_ratio = 1.0      # Phase 1 --sample_ratio (the Act-3 operating point)
uncond_epochs = 4       # Phase 1 dose: 2 epochs at a minority share is memorization-neutral
num_soup = 3            # number of seeded fine-tunes to soup (seeds 1001..1000+N; souping absorbs the seed lottery). >= 2
# lr_pool = "1e-5,2e-5,4e-5"  # Phase 2 per-ingredient learning rates (cycled if shorter than num_soup). Unset = every ingredient uses learning_rate above (seed-only soup).
# lr_interval = "1e-5:4e-5"   # ...or a geometric spread over num_soup points. Mutually exclusive with lr_pool. NOTE: the soup is a UNIFORM average with no greedy-selection gate — a bad LR draw is averaged in, not dropped. Keep the spread narrow.
# rank = 16             # Phase 3 SVD truncation rank; default = network_dim above
# uncond_init = ""      # pin a pre-trained uncond adapter → Phase 1 skipped (pool/uncond_ratio/uncond_epochs ignored). Bare name resolves under output/ckpt/.
