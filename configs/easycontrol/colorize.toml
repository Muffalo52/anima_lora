name = "colorize"

[staging]
engine = "gpu"
only_data_includes=[]
exclude_data_includes = ["monochrome", "greyscale"]

[preprocess]
target_drop_sat = 0.10
target_wb_strength = 1.0
target_wb_max_gain = 1.35
text_shuffle_variants = 4
text_tag_dropout_rate = 0.8
text_keep_copyright = true
text_keep_comic = true

[training]
network_dim = 48
network_alpha = 152

target_res = [896, 1024]
network_args = [
    "b_cond_init=-4.0",
    "cond_scale=1.0",
    "apply_ffn_lora=1",
    "cond_res_scale=1.0",
    "use_repa=true",
    "repa_weight=0.05",
    "repa_layer=8",
    "repa_target_dog=true"
]
blocks_to_swap = 0
output_name = "anima_colorize"
sigmoid_bias = 0
masked_loss=false

learning_rate = 2e-5
max_train_epochs = 5
save_every_n_epochs = 5
checkpointing_epochs = 5

easycontrol_cond_noise_max = 0.0
easycontrol_drop_p = 0.0

caption_dropout_rate = 0.2
use_shuffled_caption_variants = true
use_shuffled_caption_variants_only = true

[general]
caption_extension = '.txt'

[[datasets]]
batch_size = 1
validation_split_num=0
validation_seed = 42

  [[datasets.subsets]]
  image_dir = 'post_image_dataset/resized'
  cache_dir = 'post_image_dataset/lora'
  cond_cache_dir = 'post_image_dataset/easycontrol/{name}/cond'
  text_cache_dir = 'post_image_dataset/easycontrol/{name}/text'
  latent_cache_dir = 'post_image_dataset/easycontrol/{name}/target'
  recursive = true
  flip_aug = false
  num_repeats = 1

[variant]
family = "easycontrol"
label = "Colorize (B&W manga → color)"
description = "Colorize a B&W screentoned manga page. Cond = synthetic mangafied B&W (XDoG + screentone); text = color-only captions (hue). Empty prompt auto-colorizes; a color prompt steers. Configured in configs/easycontrol/colorize.toml (edit the file directly)."
order = 20
