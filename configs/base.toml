pretrained_model_name_or_path = "models/diffusion_models/anima-base-v1.0.safetensors"
qwen3 = "models/text_encoders/qwen_3_06b_base.safetensors"
vae = "models/vae/qwen_image_vae.safetensors"

output_dir = "output/ckpt"
output_name = "anima_lora"
logging_dir = "output/logs"
# Arbitrary note embedded verbatim in the checkpoint metadata (ss_training_comment).
# Overridable per-preset/method/CLI and surfaced as a GUI field; leave empty for none.
training_comment = "Trained via anima_lora Colab trainer (https://github.com/Muffalo52/anima_lora-Colab-Trainer)"
log_with = "tensorboard"

network_module = "networks.lora_anima"
network_train_unet_only = true

resized_image_dir = "post_image_dataset/resized"
lora_cache_dir = "post_image_dataset/lora"

sample_ratio = 1.0
artists_shard = ""

optimizer_type = "AdamW"
lr_scheduler = "cosine"
lr_warmup_steps = 0.05

timestep_sampling = "sigmoid"
sigmoid_bias = 0.0
discrete_flow_shift = 1.0

gradient_checkpointing = false
unsloth_offload_checkpointing = false

use_vae_cache = true
use_text_cache = true
skip_cache_check = true
vae_chunk_size = 64
vae_disable_cache = true
masked_loss = true
torch_compile = true
attn_mode = "flash"
mixed_precision = "bf16"
save_precision = "bf16"
compile_dynamic_seq = true
activation_memory_budget = 0.99
log_every_n_steps=2
dataloader_pin_memory = true
persistent_data_loader_workers= true
use_cmmd = false
channel_scaling_alpha = 0.5
gradient_accumulation_steps=1
train_adaln = true
adaln_rank = 16

sigma_lowres = false
sigma_lowres_route = "1024:896"
sigma_lowres_threshold = 0.5
sigma_lowres_span = "late:0.75"
sigma_lowres_route2 = "1024:768"
sigma_lowres_threshold2 = 0.65
sigma_lowres_threshold2_max = 0.95
sigma_lowres_span2 = "late:0.75"

use_repa = false

# Resolution schedule (docs/proposal/autoscale_resolution_curriculum.md).
# autoscale_mode: "none" (off — train normally) | "curriculum" (train the bulk of
# the run at the cheapest cached tier, switch to the top tier for the final
# autoscale_highres_ratio fraction of steps) | "random" (interleave high/low-res
# batches throughout, drawing the top tier for autoscale_highres_ratio of each
# epoch's batches). Tiers are discovered from the populated buckets (cache both
# via ``make preprocess-resize ARGS="--autoscale_tiers 896 1024"``); a single-tier
# dataset makes the schedule a no-op. autoscale_highres_ratio = fraction of
# training at the top tier (both modes). ramp (curriculum only) = "step" (hard
# low→high switch, exact for a 2-tier ladder) | "stairs" (climb across ≥3 tiers).
autoscale_mode = "none"
autoscale_highres_ratio = 0.5
autoscale_ramp = "step"

[general]
[[datasets]]
batch_size = 1

validation_split_num = 0
validation_seed = 42

# Kohya-style folder repeats: when true, images under a subfolder named
# {n}_... (e.g. image_dataset/5_mychar/) are repeated n times per epoch
# instead of num_repeats; 0_... drops the folder from training. Folder names
# survive preprocessing (resize/caches mirror the source tree), so this
# applies to the resized tree too. Training pool only. Kept at the dataset
# level (subset-ascendable) so the GUI's [[datasets]] override can flip it.
repeat_by_folder_name = true

  [[datasets.subsets]]
  image_dir = '{resized_image_dir}'
  cache_dir = '{lora_cache_dir}'
  num_repeats = 1
  recursive = true
