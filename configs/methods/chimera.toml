network_alpha = 128
network_dim = 32

learning_rate = 2e-5
max_train_epochs = 16
save_every_n_epochs = 4
checkpointing_epochs = 4

use_shuffled_caption_variants = true
cache_llm_adapter_outputs = true
caption_dropout_rate = 0.1

output_name = "anima_chimera-0616"

use_ortho = true

chimera_expert_basis_mult = 4
chimera_expert_diag = true

blocks_to_swap=0

use_chimera_hydra = true
num_experts_content = 6
num_experts_freq = 2

balance_loss_warmup_ratio = 0.0
balance_loss_weight = 1.0
balance_w_content = 1e-3
network_content_router_lr_scale = 5.0

content_router_layer_norm = true

use_repa       = true
repa_mode      = "relational"
repa_weight    = 0.05
repa_layer     = 8
repa_encoder   = "pe_spatial"
repa_lr_scale  = 1.0
repa_target_dog= true

freq_router_mode = "fei"
freq_router_tau = 1.0
activation_memory_budget = 0.99

fei_feature_dim = 2
fei_sigma_low_div = 4.0
max_data_loader_n_workers=1
router_targets = ".*(output_proj|mlp\\.layer[12])$"

[[datasets]]
validation_split_num = 8
