# LoRA family — method selection via toggle blocks.
#
# Default (uncommented) = LoRA + OrthoLoRA + T-LoRA

# Routing config is on the three-axis surface
# Per-variant dim/alpha/lr/epochs are experiment drift, not calibrated
# defaults — tune freely.
# 90, 128, 152, 180, 214 each for 16, 32, 48, 64, 96

network_alpha = 128
network_dim = 32

learning_rate = 2e-5
max_train_epochs = 8
save_every_n_epochs = 8
checkpointing_epochs = 8

use_shuffled_caption_variants = true
# use_randomized_caption_variants = true
cache_llm_adapter_outputs = true
caption_dropout_rate = 0.1

output_name = "anima_lora"
down_init = "weight_svd"
path_pattern = "*"

use_timestep_mask = true
min_rank = 1
alpha_rank_scale = 1.0


use_repa       = true
repa_mode      = "relational"
repa_weight    = 0.05          # settles at ~4% of total loss at plateau
repa_layer     = 8            # block to hook (of 28)
repa_encoder   = "pe_spatial"

